# Builds the website in _website/ and publishes it to GitHub Pages.
# It runs when the site changes and on every published release, so the download
# buttons, version and release date always point at the newest build.
name: Website

on:
  push:
    branches: [main]
    paths:
      - "_website/**"
      - ".github/workflows/pages.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: _website
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: _website

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: _website/package-lock.json

      - run: npm ci --no-audit --no-fund

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build (the newest release is read from the GitHub API)
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
