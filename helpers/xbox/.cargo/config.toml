# As in Xodus: hardware AES for MSIXVC decryption (every x86-64 CPU since ~2011).
[target.'cfg(all(windows, target_arch = "x86_64"))']
rustflags = ["-Ctarget-feature=+aes,+ssse3", "-Ctarget-feature=+crt-static"]

# Linux: the same CPU features, with the C runtime linked dynamically (GTK and WebKitGTK are shared
# libraries, and a static glibc would also break the build's proc-macros).
[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))']
rustflags = ["-Ctarget-feature=+aes,+ssse3"]
